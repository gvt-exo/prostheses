data_loading:
  data_root: data
  train_data_path: ${data_loading.data_root}/train_data/ninaprodb1train.pkl
  test_data_path: ${data_loading.data_root}/test_data/ninaprodb1test.pkl
  val_size: 0.2
  window_size: 200
  move_length: 500
  sliding_window_size: 50
  step_size: 10
training:
  batch_size: 64
  lr: 0.0005
  num_workers: 8
  num_epochs: 150
  weight_decay: 0.0005
