data_loading:
  data_root: data
  train_data_path: ${data_loading.data_root}/train_data/ninaprodb1train.pkl
  test_data_path: ${data_loading.data_root}/test_data/ninaprodb1test.pkl
  val_size: 0.2
  window_size: 200
  move_length: 100
  sliding_window_size: 25
  step_size: 10
training:
  batch_size: 128
  lr: 0.001
  num_workers: 8
  num_epochs: 100
  weight_decay: 0.001
model:
  num_classes: 17
  input_channels: 10
  cnn_filters:
    - 64
    - 128
    - 256
  kernel_sizes:
    - 3
    - 3
    - 3
  lstm_hidden_size: 200
  lstm_layers: 1
  fc_units:
    - 512
  dropout: 0.3
